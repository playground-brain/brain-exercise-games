<title>Day 24 스트룹 변형, 글자가 아닌 색 맞히기 | 오늘의 두뇌운동</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root {
    --bg: #fff6e9;
    --bg-soft: #ffedd3;
    --card: #fffdf8;
    --ink: #4a2b12;
    --ink-soft: #7a5230;
    --line: #f0cf9f;
    --orange: #d95f06;
    --orange-deep: #b34a02;
    --orange-soft: #ffe3bd;
    --selected-bg: #ffd9a3;
    --selected-line: #d95f06;
    --good: #2e7d32;
    --good-bg: #e2f2df;
    --missed-bg: #fff0d6;
    --wrong: #b3261e;
    --wrong-bg: #fbe3e0;
    --shadow: 0 6px 20px rgba(146, 84, 20, 0.14);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #251305;
      --bg-soft: #3a2110;
      --card: #38220f;
      --ink: #fdeed3;
      --ink-soft: #dcbd93;
      --line: #6e4a26;
      --orange: #f08a2e;
      --orange-deep: #ffb066;
      --orange-soft: #54340f;
      --selected-bg: #7a4d16;
      --selected-line: #f08a2e;
      --good: #8fd694;
      --good-bg: #1e3d1c;
      --missed-bg: #4d3608;
      --wrong: #ff9d94;
      --wrong-bg: #4d1a15;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans KR", sans-serif;
    font-size: 1.25rem;
    line-height: 1.6;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }

  /* language buttons */
  .lang-bar { display: flex; justify-content: center; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 1.4rem; }
  .lang-btn {
    border-radius: 999px; border: 3px solid var(--line); background: var(--card);
    color: var(--ink-soft); min-height: 56px; font-size: 1.25rem; font-weight: 900;
    padding: 0.55rem 1.4rem; cursor: pointer; font-family: inherit;
  }
  .lang-btn.active { background: var(--orange); border-color: var(--orange); color: #fff; }

  /* header */
  header { text-align: center; margin-bottom: 1.6rem; }
  .day-badge {
    display: inline-block; border-radius: 999px; background: var(--orange-soft);
    color: var(--orange-deep); font-size: 1.15rem; font-weight: 700; padding: 0.35rem 1.1rem;
  }
  h1 {
    font-family: "Jua", sans-serif; font-size: clamp(2.4rem, 9vw, 3.6rem);
    line-height: 1.2; margin: 0.9rem 0 0.6rem; font-weight: 400;
  }
  .lead { font-size: 1.35rem; color: var(--ink-soft); max-width: 34rem; margin: 0 auto; }

  /* section titles */
  h2.section-title { font-family: "Jua", sans-serif; font-weight: 400; font-size: 1.9rem; text-align: center; margin: 2.4rem 0 1rem; }

  /* game shell */
  .game-shell {
    background: var(--card); border: 2px solid var(--line); border-radius: 24px;
    box-shadow: var(--shadow); padding: 1.5rem 1.25rem 1.75rem;
  }
  .progress-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.2rem; }
  .progress-text { font-size: 1.4rem; font-weight: 900; color: var(--orange-deep); }
  .dots { display: flex; gap: 0.5rem; }
  .dot { width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--orange); background: transparent; }
  .dot.done { background: var(--orange); }
  .dot.now { background: var(--orange-soft); box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--orange); }

  .phase-title { font-family: "Jua", sans-serif; font-weight: 400; font-size: 1.9rem; text-align: center; margin: 0.4rem 0 0.3rem; line-height: 1.3; }
  .phase-desc { text-align: center; color: var(--ink-soft); font-size: 1.3rem; margin: 0 0 1.2rem; }

  /* stroop: one big colour word in a mismatched ink colour + 4 colour buttons */
  .stroop-word {
    font-family: "Jua", sans-serif; font-size: clamp(3.4rem, 14vw, 5.2rem); font-weight: 400;
    text-align: center; line-height: 1.2; margin: 0.6rem 0 1.4rem;
  }
  .color-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem; max-width: 560px; margin: 0 auto 1.3rem; }
  .color-btn {
    border: 3px solid var(--line); border-radius: 22px; min-height: 110px;
    font-size: 1.5rem; font-weight: 900; cursor: pointer;
    background: var(--bg-soft); color: var(--ink);
    display: flex; align-items: center; justify-content: center; gap: 0.8rem;
    transition: transform 0.12s, background 0.12s, box-shadow 0.12s;
    font-family: inherit;
  }
  .color-btn .swatch {
    width: 34px; height: 34px; border-radius: 50%; flex: 0 0 auto;
    border: 3px solid rgba(0, 0, 0, 0.18);
  }
  .color-btn:active { transform: scale(0.97); }
  .color-btn:disabled { cursor: default; }
  .color-btn.picked { background: var(--selected-bg); border-color: var(--selected-line); box-shadow: inset 0 0 0 2px var(--selected-line); }
  .demo-word { font-family: "Jua", sans-serif; font-size: 2.4rem; }

  .sound-row { text-align: center; margin-bottom: 0.9rem; }
  .sound-btn {
    background: transparent; border: 2px solid var(--line); border-radius: 999px;
    padding: 0.35rem 1.1rem; font-size: 1.15rem; font-weight: 700;
    color: var(--ink-soft); cursor: pointer; font-family: inherit;
  }
  .status-line { text-align: center; font-size: 1.4rem; font-weight: 700; color: var(--ink-soft); margin: 0 0 1.1rem; min-height: 2.2rem; }
  .status-line.wrong { color: var(--wrong); }
  .status-line b { color: var(--orange-deep); }

  .trial-recap { list-style: none; margin: 0 0 1.2rem; padding: 0; display: grid; gap: 0.6rem; }
  .trial-recap li {
    display: flex; align-items: center; justify-content: center; gap: 0.7rem; flex-wrap: wrap;
    font-size: 1.3rem; background: var(--bg-soft); border: 2px solid var(--line);
    border-radius: 14px; padding: 0.5rem 0.8rem;
  }
  .trial-recap .recap-word { font-family: "Jua", sans-serif; font-size: 1.7rem; }
  .tag { font-weight: 900; font-size: 1.2rem; padding: 0.15rem 0.7rem; border-radius: 999px; }
  .tag-good { background: var(--good-bg); color: var(--good); }
  .tag-wrong { background: var(--wrong-bg); color: var(--wrong); }

  .score-line { font-family: "Jua", sans-serif; font-size: 2.1rem; text-align: center; margin: 0.6rem 0 0.3rem; line-height: 1.3; }
  .praise { text-align: center; font-size: 1.35rem; color: var(--ink-soft); margin: 0 0 0.6rem; }
  .attempts-line { text-align: center; font-size: 1.3rem; margin: 0 0 1.2rem; }
  .attempts-line b { color: var(--orange-deep); }

  .btn-row { display: flex; gap: 0.8rem; justify-content: center; flex-wrap: wrap; margin-top: 0.4rem; }
  .btn {
    border-radius: 999px; border: 3px solid var(--orange); font-size: 1.4rem; font-weight: 900;
    min-height: 64px; padding: 0.8rem 2rem; cursor: pointer; font-family: inherit;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--orange); color: #fff; }
  .btn-ghost { background: transparent; color: var(--orange-deep); }
  .new-set-row { text-align: center; margin-top: 1.1rem; }

  .total-list { list-style: none; margin: 0 0 1.2rem; padding: 0; }
  .total-list li { font-size: 1.35rem; padding: 0.55rem 0.2rem; border-bottom: 2px dashed var(--line); text-align: center; }
  .total-list li:last-child { border-bottom: none; }
  .total-score { font-family: "Jua", sans-serif; font-size: 2rem; text-align: center; margin: 0.4rem 0 0.3rem; line-height: 1.3; }

  /* steps & tips cards */
  .steps, .tips { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.8rem; }
  .steps li, .tips li {
    background: var(--card); border: 2px solid var(--line); border-radius: 18px;
    font-size: 1.35rem; padding: 1rem 1.1rem; display: flex; gap: 1rem; align-items: flex-start;
  }
  .steps .num {
    flex: 0 0 auto; width: 52px; height: 52px; border-radius: 50%; background: var(--orange);
    color: #fff; font-family: "Jua", sans-serif; font-size: 1.6rem;
    display: flex; align-items: center; justify-content: center;
  }
  .steps li p, .tips li p { margin: 0.35rem 0 0; }
  .steps strong, .tips strong { color: var(--orange-deep); }

  /* difficulty table */
  .diff-wrap { background: var(--card); border: 2px solid var(--line); border-radius: 18px; overflow: hidden; }
  table.diff { width: 100%; border-collapse: collapse; font-size: 1.3rem; }
  table.diff th, table.diff td { padding: 0.8rem 1rem; text-align: left; }
  table.diff thead th { background: var(--orange-soft); color: var(--orange-deep); font-weight: 900; }
  table.diff tbody tr + tr td, table.diff tbody tr + tr th { border-top: 2px solid var(--line); }

  .closing { text-align: center; font-size: 1.3rem; color: var(--ink-soft); margin-top: 2.4rem; }

  button:focus-visible, a:focus-visible { outline: 4px solid var(--orange); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
  @media (max-width: 480px) {
    .btn-row { flex-direction: column; }
    .btn-row .btn { width: 100%; }
    .new-set-row .btn { width: 100%; }
    .lang-bar { flex-wrap: nowrap; }
    .lang-btn { flex: 1 1 30%; padding: 0.55rem 0.4rem; }
    table.diff { font-size: 1.18rem; }
    .progress-text { font-size: 1.25rem; }
    .color-btn { min-height: 92px; font-size: 1.35rem; }
    .stroop-word { font-size: 3rem; }
  }
</style>
</head>

<div class="wrap">

  <div class="lang-bar" id="langBar" role="group" aria-label="Language">
    <button class="lang-btn active" data-lang="ko">한국어</button>
    <button class="lang-btn" data-lang="en">English</button>
    <button class="lang-btn" data-lang="ja">日本語</button>
  </div>

  <header>
    <span class="day-badge" id="badge"></span>
    <h1 id="title"></h1>
    <p class="lead" id="lead"></p>
  </header>

  <main>
    <section class="game-shell" aria-label="Game">
      <div class="progress-row">
        <div class="progress-text" id="progressText"></div>
        <div class="dots" id="dots" aria-hidden="true"></div>
      </div>
      <div id="gameArea"></div>
    </section>
    <div class="new-set-row">
      <button class="btn btn-ghost" id="newSetBtn" data-act="new-set"></button>
    </div>

    <section id="howSection">
      <h2 class="section-title" id="howTitle"></h2>
      <ol class="steps" id="stepsList"></ol>
    </section>

    <section id="diffSection">
      <h2 class="section-title" id="diffTitle"></h2>
      <div class="diff-wrap">
        <table class="diff">
          <thead><tr id="diffHead"></tr></thead>
          <tbody id="diffBody"></tbody>
        </table>
      </div>
    </section>

    <section id="tipsSection">
      <h2 class="section-title" id="tipsTitle"></h2>
      <ul class="tips" id="tipsList"></ul>
    </section>

    <p class="closing" id="closing"></p>
  </main>
</div>

    totalScore: "全部で {total}問のうち {got}問合いました",
    restartTodayBtn: "今日の問題で最初から",
    newSetBtn: "新しい問題ではじめる",
    soundOn: "音あり",
    soundOff: "音なし",
    howTitle: "遊び方",
    steps: [
      "大きな文字が出たら、<strong>文字ではなく文字の色</strong>を見ましょう。「あお」と書いてあっても、色が赤なら答えは赤です。",
      "下の4つの色のボタンから、<strong>文字の色と同じボタン</strong>を押してください。",
      "まちがえたら正しい色をお知らせします。<strong>次の問題へ進みましょう。</strong>時間を計りません。"
    ],
    diffTitle: "むずかしさの案内",
    diffHead: ["ゲーム", "解く問題", "むずかしさ"],
    diffRows: [
      ["1つ目のゲーム", "3問", "とてもやさしい"],
      ["2つ目のゲーム", "4問", "やさしい"],
      ["3つ目のゲーム", "5問", "ふつう"],
      ["4つ目のゲーム", "6問", "すこしむずかしい"],
      ["5つ目のゲーム", "7問", "むずかしい"]
    ],
    tipsTitle: "上手にやるコツ",
    tips: [
      "<strong>文字は気にしない</strong> — 文字が何と書いてあるかは見ずに、色だけを見ましょう。",
      "<strong>色を声に出して読む</strong> — 「あか」と口に出すと、答えが見えやすくなります。",
      "<strong>ひとつずつゆっくり</strong> — 次の問題はまだありません。今の文字ひとつだけを見ましょう。",
      "<strong>まちがえても大丈夫</strong> — まちがえた問題は正しい色をお知らせします。もう一度やることが練習です。"
    ],
    closing: "今日も脳トレを一回分、おつかれさまでした。",
    colorNames: ["あか", "あお", "みどり", "きいろ"]
  }
};

/* ---------- seeded random (string seed -> hash -> mulberry32) ---------- */
function hashSeed(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function todayStr() {
  const d = new Date();
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return d.getFullYear() + "-" + mm + "-" + dd;
}
function dateSeedStr() { return "day24-" + todayStr(); }

/* Draw one set of 5 games from a seed string.
   Per game: n = game index + 3 trials (3 -> 7, 25 in total).
   Each trial: a word index and an ink index, ink never equals word. */
function buildSet(seedStr) {
  const rand = mulberry32(hashSeed(seedStr));
  const games = [];
  for (let g = 0; g < 5; g++) {
    const n = g + 3;
    const trials = [];
    for (let i = 0; i < n; i++) {
      const word = Math.floor(rand() * COLORS.length);
      let ink = Math.floor(rand() * COLORS.length);
      while (ink === word) ink = Math.floor(rand() * COLORS.length);
      trials.push({ word: word, ink: ink });
    }
    games.push({ n: n, trials: trials });
  }
  return games;
}

/* ---------- state ---------- */
let lang = "ko";
let setSeed = dateSeedStr();
let games = buildSet(setSeed);
let cur = 0;                 // current game index 0..4
let phase = "ready";         // ready | play | result | total
let trialIdx = 0;            // current trial index in this game
let correct = 0;             // correct answers in the current game
let mistakes = 0;            // wrong taps in the current game
let results = [];            // per-trial true/false for the current game
let lastWrong = -1;          // ink index of the last wrong trial, shown briefly
let locked = false;          // input locked while the wrong answer is shown
let trialToken = 0;          // guards the auto-advance timer after a wrong tap
let soundOn = true;
let scores = [null, null, null, null, null]; // {n, got} per game

function S() { return STRINGS[lang]; }
function el(id) { return document.getElementById(id); }
function fmt(tpl, map) {
  return tpl.replace(/\{(\w+)\}/g, function (_, k) { return map[k]; });
}
/* ---------- sound (Web Audio, guarded so the game works without it) ---------- */
let audioCtx = null;
function beep(freq, durMs) {
  if (!soundOn) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = "sine";
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + durMs / 1000);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + durMs / 1000 + 0.05);
  } catch (e) { /* audio unavailable — the game still works with light only */ }
}
/* ---------- static texts (explicit function — no MutationObserver) ---------- */
function applyStaticTexts() {
  const L = S();
  el("badge").textContent = L.badge;
  el("title").textContent = L.title;
  el("lead").textContent = L.lead;
  el("newSetBtn").textContent = L.newSetBtn;
  el("howTitle").textContent = L.howTitle;
  el("howSection").setAttribute("aria-label", L.howTitle);
  el("stepsList").innerHTML = L.steps.map(function (s, i) {
    return "<li><span class=\"num\">" + (i + 1) + "</span><p>" + s + "</p></li>";
  }).join("");
  el("diffTitle").textContent = L.diffTitle;
  el("diffSection").setAttribute("aria-label", L.diffTitle);
  el("diffHead").innerHTML = L.diffHead.map(function (h) { return "<th>" + h + "</th>"; }).join("");
  el("diffBody").innerHTML = L.diffRows.map(function (r) {
    return "<tr><td>" + r[0] + "</td><td>" + r[1] + "</td><td>" + r[2] + "</td></tr>";
  }).join("");
  el("tipsTitle").textContent = L.tipsTitle;
  el("tipsSection").setAttribute("aria-label", L.tipsTitle);
  el("tipsList").innerHTML = L.tips.map(function (s) { return "<li><p>" + s + "</p></li>"; }).join("");
  el("closing").textContent = L.closing;
  document.querySelectorAll(".lang-btn").forEach(function (b) {
    b.classList.toggle("active", b.getAttribute("data-lang") === lang);
  });
  document.documentElement.lang = lang;
  renderProgress();
  renderGame();
}

/* ---------- rendering ---------- */
function renderProgress() {
  const L = S();
  if (phase === "total") {
    el("progressText").textContent = L.totalProgress;
  } else {
    el("progressText").textContent = fmt(L.progress, { n: cur + 1 });
  }
  let dots = "";
  for (let i = 0; i < 5; i++) {
    let cls = "dot";
    if (phase === "total" || scores[i] !== null) cls += " done";
    else if (i === cur) cls += " now";
    dots += "<span class=\"" + cls + "\"></span>";
  }
  el("dots").innerHTML = dots;
}

function demoWordHtml() {
  // Demo on the ready screen: the word for blue printed in red ink.
  return "<p style=\"text-align:center;margin:0 0 1.2rem;\"><span class=\"demo-word\" style=\"color:" +
    COLORS[0].hex + ";\">" + colorName(1) + "</span></p>";
}

function stroopWordHtml(trial) {
  return "<p class=\"stroop-word\" style=\"color:" + COLORS[trial.ink].hex + ";\">" +
    colorName(trial.word) + "</p>";
}

function colorButtonsHtml(disabled) {
  let html = "<div class=\"color-grid\">";
  COLORS.forEach(function (c, i) {
    html += "<button class=\"color-btn\" data-act=\"color\" data-color=\"" + i + "\"" +
      (disabled ? " disabled" : "") + "><span class=\"swatch\" style=\"background:" + c.hex + ";\"></span>" +
      colorName(i) + "</button>";
  });
  return html + "</div>";
}

function soundRowHtml() {
  const L = S();
  return "<div class=\"sound-row\"><button class=\"sound-btn\" data-act=\"toggle-sound\">" +
    (soundOn ? L.soundOn : L.soundOff) + "</button></div>";
}

function renderGame() {
  const L = S();
  const area = el("gameArea");
  if (phase === "total") { area.innerHTML = totalHtml(); return; }
  const g = games[cur];
  let html = "";
  if (phase === "ready") {
    html += "<h3 class=\"phase-title\">" + L.readyTitle + "</h3>";
    html += "<p class=\"phase-desc\">" + L.readyDesc + "</p>";
    html += demoWordHtml();
    html += "<p class=\"phase-desc\">" + L.readyDemo + "</p>";
    html += soundRowHtml();
    html += "<p class=\"status-line\">&nbsp;</p>";
    html += "<div class=\"btn-row\"><button class=\"btn btn-primary\" data-act=\"start-stroop\">" + L.startBtn + "</button></div>";
  } else if (phase === "play") {
    const t = g.trials[trialIdx];
    html += "<h3 class=\"phase-title\">" + L.playTitle + "</h3>";
    html += "<p class=\"phase-desc\">" + fmt(L.playDesc, { n: trialIdx + 1 }) + "</p>";
    html += soundRowHtml();
    if (lastWrong >= 0) {
      html += "<p class=\"status-line wrong\">" + fmt(L.wrongMsg, { c: colorName(lastWrong) }) + "</p>";
    } else {
      html += "<p class=\"status-line\">" + fmt(L.trialCount, { n: correct }) + "</p>";
    }
    html += stroopWordHtml(t);
    html += colorButtonsHtml(locked);
  } else { // result
    const sc = scores[cur];
    html += "<p class=\"score-line\">" + fmt(L.scoreText, { total: sc.n, got: sc.got }) + "</p>";
    html += "<p class=\"praise\">" + praiseFor(sc.got, sc.n) + "</p>";
    html += "<p class=\"attempts-line\">" + fmt(L.mistakesLine, { n: sc.n - sc.got }) + "</p>";
    html += "<ul class=\"trial-recap\">";
    g.trials.forEach(function (t, i) {
      const ok = results[i];
      html += "<li><span class=\"recap-word\" style=\"color:" + COLORS[t.ink].hex + ";\">" +
        colorName(t.word) + "</span><span class=\"tag " + (ok ? "tag-good" : "tag-wrong") + "\">" +
        (ok ? L.rightTag : fmt(L.wrongTag, { c: colorName(t.ink) })) + "</span></li>";
    });
    html += "</ul>";
    html += "<div class=\"btn-row\">";
    if (cur < 4) html += "<button class=\"btn btn-primary\" data-act=\"next\">" + L.nextBtn + "</button>";
    else html += "<button class=\"btn btn-primary\" data-act=\"final\">" + L.finalBtn + "</button>";
    html += "<button class=\"btn btn-ghost\" data-act=\"retry-game\">" + L.retryBtn + "</button></div>";
  }
  area.innerHTML = html;
}

function praiseFor(got, total) {
  const L = S();
  if (got >= total) return L.praisePerfect;
  if (got >= total - 1) return L.praiseGreat;
  return L.praiseGood;
}

function totalHtml() {
  const L = S();
  let totalGot = 0;
  let totalN = 0;
  let html = "<h3 class=\"phase-title\">" + L.totalTitle + "</h3>";
  html += "<ul class=\"total-list\">";
  scores.forEach(function (sc, i) {
    if (sc) { totalGot += sc.got; totalN += sc.n; }
    html += "<li>" + fmt(L.totalLine, { i: i + 1, n: games[i].n, got: sc ? sc.got : 0 }) + "</li>";
  });
  html += "</ul>";
  html += "<p class=\"total-score\">" + fmt(L.totalScore, { total: totalN, got: totalGot }) + "</p>";
  html += "<p class=\"praise\">" + praiseFor(totalGot, totalN) + "</p>";
  html += "<div class=\"btn-row\"><button class=\"btn btn-primary\" data-act=\"restart-today\">" + L.restartTodayBtn + "</button></div>";
  return html;
}

function renderAll() { renderProgress(); renderGame(); }

function startSet(seedStr) {
  setSeed = seedStr;
  games = buildSet(seedStr);
  trialToken++;
  cur = 0;
  phase = "ready";
  trialIdx = 0;
  correct = 0;
  mistakes = 0;
  results = [];
  lastWrong = -1;
  locked = false;
  scores = [null, null, null, null, null];
  renderAll();
}

function finishTrial(ok) {
  const g = games[cur];
  results[trialIdx] = ok;
  if (ok) correct++;
  else mistakes++;
  trialIdx++;
  lastWrong = -1;
  locked = false;
  if (trialIdx >= g.n) {
    scores[cur] = { n: g.n, got: correct };
    phase = "result";
    renderAll();
  } else {
    renderGame();
  }
}

function nextGame() {
  cur += 1;
  trialToken++;
  trialIdx = 0;
  correct = 0;
  mistakes = 0;
  results = [];
  lastWrong = -1;
  locked = false;
  phase = "ready";
  renderAll();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ---------- events (explicit handlers only) ---------- */
document.addEventListener("click", function (e) {
  const langBtn = e.target.closest("button[data-lang]");
  if (langBtn) {
    const next = langBtn.getAttribute("data-lang");
    if (next !== lang) { lang = next; applyStaticTexts(); } // game state is kept
    return;
  }
  const btn = e.target.closest("button[data-act]");
  if (!btn || btn.disabled) return;
  const act = btn.getAttribute("data-act");
  if (act === "toggle-sound") {
    soundOn = !soundOn;
    renderGame();
  } else if (act === "start-stroop") {
    phase = "play";
    renderAll();
  } else if (act === "color") {
    if (phase !== "play" || locked) return;
    const picked = Number(btn.getAttribute("data-color"));
    const t = games[cur].trials[trialIdx];
    if (picked === t.ink) {
      beep(520, 180);
      finishTrial(true);
    } else {
      mistakes++;
      beep(140, 300);
      lastWrong = t.ink;
      locked = true;
      renderGame();
      const token = trialToken;
      setTimeout(function () {
        if (token !== trialToken || phase !== "play") return;
        results[trialIdx] = false;
        trialIdx++;
        lastWrong = -1;
        locked = false;
        if (trialIdx >= games[cur].n) {
          scores[cur] = { n: games[cur].n, got: correct };
          phase = "result";
          renderAll();
        } else {
          renderGame();
        }
      }, 1500);
    }
  } else if (act === "retry-game") {
    scores[cur] = null;
    trialToken++;
    trialIdx = 0;
    correct = 0;
    mistakes = 0;
    results = [];
    lastWrong = -1;
    locked = false;
    phase = "ready";
    renderAll();
    window.scrollTo({ top: 0, behavior: "smooth" });
  } else if (act === "next") {
    nextGame();
  } else if (act === "final") {
    phase = "total";
    renderAll();
    window.scrollTo({ top: 0, behavior: "smooth" });
  } else if (act === "restart-today") {
    startSet(dateSeedStr());
    window.scrollTo({ top: 0, behavior: "smooth" });
  } else if (act === "new-set") {
    startSet(dateSeedStr() + "-alt-" + Date.now());
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
});

/* Test/debug accessor: read-only view of the current game state. */
window.__stroop = {
  phase: function () { return phase; },
  trial: function () { const t = games[cur].trials[trialIdx]; return t ? { word: t.word, ink: t.ink } : null; },
  trialIdx: function () { return trialIdx; },
  trials: function () { return games[cur].trials.map(function (t) { return { word: t.word, ink: t.ink }; }); },
  correct: function () { return correct; },
  mistakes: function () { return mistakes; },
  results: function () { return results.slice(); },
  locked: function () { return locked; },
  scores: function () {
    return scores.map(function (sc) { return sc ? { n: sc.n, got: sc.got } : null; });
  }
};

/* ---------- init ---------- */
applyStaticTexts();
</script>
</body>
</html>
