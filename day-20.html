<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 20 틀린 그림 찾기 | 오늘의 두뇌운동</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root {
    --bg: #fff6e9;
    --bg-soft: #ffedd3;
    --card: #fffdf8;
    --ink: #4a2b12;
    --ink-soft: #7a5230;
    --line: #f0cf9f;
    --orange: #d95f06;
    --orange-deep: #b34a02;
    --orange-soft: #ffe3bd;
    --selected-bg: #ffd9a3;
    --selected-line: #d95f06;
    --good: #2e7d32;
    --good-bg: #e2f2df;
    --missed-bg: #fff0d6;
    --wrong: #b3261e;
    --wrong-bg: #fbe3e0;
    --shadow: 0 6px 20px rgba(146, 84, 20, 0.14);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #251305;
      --bg-soft: #3a2110;
      --card: #38220f;
      --ink: #fdeed3;
      --ink-soft: #dcbd93;
      --line: #6e4a26;
      --orange: #f08a2e;
      --orange-deep: #ffb066;
      --orange-soft: #54340f;
      --selected-bg: #7a4d16;
      --selected-line: #f08a2e;
      --good: #8fd694;
      --good-bg: #1e3d1c;
      --missed-bg: #4d3608;
      --wrong: #ff9d94;
      --wrong-bg: #4d1a15;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans KR", sans-serif;
    font-size: 1.25rem;
    line-height: 1.6;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }

  /* language buttons */
  .lang-bar { display: flex; justify-content: center; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 1.4rem; }
  .lang-btn {
    border-radius: 999px; border: 3px solid var(--line); background: var(--card);
    color: var(--ink-soft); min-height: 56px; font-size: 1.25rem; font-weight: 900;
    padding: 0.55rem 1.4rem; cursor: pointer; font-family: inherit;
  }
  .lang-btn.active { background: var(--orange); border-color: var(--orange); color: #fff; }

  /* header */
  header { text-align: center; margin-bottom: 1.6rem; }
  .day-badge {
    display: inline-block; border-radius: 999px; background: var(--orange-soft);
    color: var(--orange-deep); font-size: 1.15rem; font-weight: 700; padding: 0.35rem 1.1rem;
  }
  h1 {
    font-family: "Jua", sans-serif; font-size: clamp(2.4rem, 9vw, 3.6rem);
    line-height: 1.2; margin: 0.9rem 0 0.6rem; font-weight: 400;
  }
  .lead { font-size: 1.35rem; color: var(--ink-soft); max-width: 34rem; margin: 0 auto; }

  /* section titles */
  h2.section-title { font-family: "Jua", sans-serif; font-weight: 400; font-size: 1.9rem; text-align: center; margin: 2.4rem 0 1rem; }

  /* game shell */
  .game-shell {
    background: var(--card); border: 2px solid var(--line); border-radius: 24px;
    box-shadow: var(--shadow); padding: 1.5rem 1.25rem 1.75rem;
  }
  .progress-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.2rem; }
  .progress-text { font-size: 1.4rem; font-weight: 900; color: var(--orange-deep); }
  .dots { display: flex; gap: 0.5rem; }
  .dot { width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--orange); background: transparent; }
  .dot.done { background: var(--orange); }
  .dot.now { background: var(--orange-soft); box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--orange); }

  .phase-title { font-family: "Jua", sans-serif; font-weight: 400; font-size: 1.9rem; text-align: center; margin: 0.4rem 0 0.3rem; line-height: 1.3; }
  .phase-desc { text-align: center; color: var(--ink-soft); font-size: 1.3rem; margin: 0 0 1.2rem; }

  /* spot-the-difference panels */
  .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem; margin-bottom: 1.1rem; }
  .panel { text-align: center; }
  .panel-label { font-size: 1.25rem; font-weight: 900; color: var(--ink-soft); margin-bottom: 0.4rem; }
  .panel-svg { width: 100%; height: auto; display: block; border: 3px solid var(--line); border-radius: 18px; background: var(--card); }
  .panel-svg circle.hot { cursor: pointer; }
  .found-ring { fill: rgba(46, 125, 50, 0.18); stroke: var(--good); stroke-width: 5; }
  .hint-ring { fill: rgba(217, 95, 6, 0.14); stroke: var(--orange); stroke-width: 5; animation: hintPulse 0.8s ease-in-out infinite alternate; }
  .wrong-ring { fill: none; stroke: var(--wrong); stroke-width: 5; }
  @keyframes hintPulse { from { opacity: 0.45; } to { opacity: 1; } }

  .sound-row { text-align: center; margin-bottom: 0.9rem; }
  .sound-btn {
    background: transparent; border: 2px solid var(--line); border-radius: 999px;
    padding: 0.35rem 1.1rem; font-size: 1.15rem; font-weight: 700;
    color: var(--ink-soft); cursor: pointer; font-family: inherit;
  }
  .status-line { text-align: center; font-size: 1.4rem; font-weight: 700; color: var(--ink-soft); margin: 0 0 1.1rem; min-height: 2.2rem; }
  .status-line.wrong { color: var(--wrong); }
  .status-line b { color: var(--orange-deep); }

  .score-line { font-family: "Jua", sans-serif; font-size: 2.1rem; text-align: center; margin: 0.6rem 0 0.3rem; line-height: 1.3; }
  .praise { text-align: center; font-size: 1.35rem; color: var(--ink-soft); margin: 0 0 0.6rem; }
  .attempts-line { text-align: center; font-size: 1.3rem; margin: 0 0 1.2rem; }
  .attempts-line b { color: var(--orange-deep); }
  .found-list { list-style: none; margin: 0 0 1.2rem; padding: 0; }
  .found-list li { font-size: 1.3rem; padding: 0.45rem 0.2rem; border-bottom: 2px dashed var(--line); text-align: center; }
  .found-list li:last-child { border-bottom: none; }
  .found-list li::before { content: "\2713  "; color: var(--good); font-weight: 900; }
  .found-list-title { text-align: center; font-size: 1.35rem; font-weight: 900; color: var(--orange-deep); margin: 0 0 0.4rem; }

  .btn-row { display: flex; gap: 0.8rem; justify-content: center; flex-wrap: wrap; margin-top: 0.4rem; }
  .btn {
    border-radius: 999px; border: 3px solid var(--orange); font-size: 1.4rem; font-weight: 900;
    min-height: 64px; padding: 0.8rem 2rem; cursor: pointer; font-family: inherit;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--orange); color: #fff; }
  .btn-ghost { background: transparent; color: var(--orange-deep); }
  .new-set-row { text-align: center; margin-top: 1.1rem; }

  .total-list { list-style: none; margin: 0 0 1.2rem; padding: 0; }
  .total-list li { font-size: 1.35rem; padding: 0.55rem 0.2rem; border-bottom: 2px dashed var(--line); text-align: center; }
  .total-list li:last-child { border-bottom: none; }
  .total-score { font-family: "Jua", sans-serif; font-size: 2rem; text-align: center; margin: 0.4rem 0 0.3rem; line-height: 1.3; }

  /* steps & tips cards */
  .steps, .tips { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.8rem; }
  .steps li, .tips li {
    background: var(--card); border: 2px solid var(--line); border-radius: 18px;
    font-size: 1.35rem; padding: 1rem 1.1rem; display: flex; gap: 1rem; align-items: flex-start;
  }
  .steps .num {
    flex: 0 0 auto; width: 52px; height: 52px; border-radius: 50%; background: var(--orange);
    color: #fff; font-family: "Jua", sans-serif; font-size: 1.6rem;
    display: flex; align-items: center; justify-content: center;
  }
  .steps li p, .tips li p { margin: 0.35rem 0 0; }
  .steps strong, .tips strong { color: var(--orange-deep); }

  /* difficulty table */
  .diff-wrap { background: var(--card); border: 2px solid var(--line); border-radius: 18px; overflow: hidden; }
  table.diff { width: 100%; border-collapse: collapse; font-size: 1.3rem; }
  table.diff th, table.diff td { padding: 0.8rem 1rem; text-align: left; }
  table.diff thead th { background: var(--orange-soft); color: var(--orange-deep); font-weight: 900; }
  table.diff tbody tr + tr td, table.diff tbody tr + tr th { border-top: 2px solid var(--line); }

  .closing { text-align: center; font-size: 1.3rem; color: var(--ink-soft); margin-top: 2.4rem; }

  button:focus-visible, a:focus-visible { outline: 4px solid var(--orange); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
  @media (max-width: 560px) {
    .panels { grid-template-columns: 1fr; }
  }
  @media (max-width: 480px) {
    .btn-row { flex-direction: column; }
    .btn-row .btn { width: 100%; }
    .new-set-row .btn { width: 100%; }
    .lang-bar { flex-wrap: nowrap; }
    .lang-btn { flex: 1 1 30%; padding: 0.55rem 0.4rem; }
    table.diff { font-size: 1.18rem; }
    .progress-text { font-size: 1.25rem; }
  }
</style>
</head>

/* ---------- seeded random (string seed -> hash -> mulberry32) ---------- */
function hashSeed(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function todayStr() {
  const d = new Date();
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return d.getFullYear() + "-" + mm + "-" + dd;
}
function dateSeedStr() { return "day20-" + todayStr(); }
function shuffle(arr, rand) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* Draw one set of 5 games from a seed string.
   Per game: scene fixed in order, N = game index + 3 differences picked from the
   scene's 8 candidates, and a coin flip for which panel shows the changed version. */
function buildSet(seedStr) {
  const rand = mulberry32(hashSeed(seedStr));
  const games = [];
  for (let g = 0; g < 5; g++) {
    const n = g + 3;
    const picked = shuffle(SCENES[g].diffs, rand).slice(0, n);
    games.push({ scene: SCENES[g], n: n, diffs: picked, swapped: rand() < 0.5 });
  }
  return games;
}

/* ---------- state ---------- */
let lang = "ko";
let setSeed = dateSeedStr();
let games = buildSet(setSeed);
let cur = 0;                 // current game index 0..4
let phase = "ready";         // ready | play | result | total
let found = new Set();       // found difference ids in the current game
let wrongTaps = 0;           // wrong taps in the current game
let hintId = null;
let soundOn = true;
let statusKind = null;       // null | "wrong" | "already" | "hint"
let statusToken = 0;
let resultToken = 0;
let scores = [null, null, null, null, null]; // {n, wrong} per game

function S() { return STRINGS[lang]; }
function el(id) { return document.getElementById(id); }
function fmt(tpl, map) {
  return tpl.replace(/\{(\w+)\}/g, function (_, k) { return map[k]; });
}
function fastMs(ms) { return window.__SPOT_FAST__ ? Math.min(ms, 60) : ms; }

/* ---------- sound (Web Audio, guarded so the game works without it) ---------- */
let audioCtx = null;
function beep(freq, durMs) {
  if (!soundOn) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = "sine";
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + durMs / 1000);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + durMs / 1000 + 0.05);
  } catch (e) { /* audio unavailable — the game still works with pictures only */ }
}

/* ---------- static texts (explicit function — no MutationObserver) ---------- */
function applyStaticTexts() {
  const L = S();
  el("badge").textContent = L.badge;
  el("title").textContent = L.title;
  el("lead").textContent = L.lead;
  el("newSetBtn").textContent = L.newSetBtn;
  el("howTitle").textContent = L.howTitle;
  el("howSection").setAttribute("aria-label", L.howTitle);
  el("stepsList").innerHTML = L.steps.map(function (s, i) {
    return "<li><span class=\"num\">" + (i + 1) + "</span><p>" + s + "</p></li>";
  }).join("");
  el("diffTitle").textContent = L.diffTitle;
  el("diffSection").setAttribute("aria-label", L.diffTitle);
  el("diffHead").innerHTML = L.diffHead.map(function (h) { return "<th>" + h + "</th>"; }).join("");
  el("diffBody").innerHTML = L.diffRows.map(function (r) {
    return "<tr><td>" + r[0] + "</td><td>" + r[1] + "</td><td>" + r[2] + "</td></tr>";
  }).join("");
  el("tipsTitle").textContent = L.tipsTitle;
  el("tipsSection").setAttribute("aria-label", L.tipsTitle);
  el("tipsList").innerHTML = L.tips.map(function (s) { return "<li><p>" + s + "</p></li>"; }).join("");
  el("closing").textContent = L.closing;
  document.querySelectorAll(".lang-btn").forEach(function (b) {
    b.classList.toggle("active", b.getAttribute("data-lang") === lang);
  });
  document.documentElement.lang = lang;
  renderProgress();
  renderGame();
}

/* ---------- rendering ---------- */
function renderProgress() {
  const L = S();
  if (phase === "total") {
    el("progressText").textContent = L.totalProgress;
  } else {
    el("progressText").textContent = fmt(L.progress, { n: cur + 1 });
  }
  let dots = "";
  for (let i = 0; i < 5; i++) {
    let cls = "dot";
    if (phase === "total" || scores[i] !== null) cls += " done";
    else if (i === cur) cls += " now";
    dots += "<span class=\"" + cls + "\"></span>";
  }
  el("dots").innerHTML = dots;
}

/* Build one panel (left or right) as HTML. The changed version goes to one
   panel only; which one is decided by the game seed. */
function buildPanel(side) {
  const g = games[cur];
  const changed = side === "left" ? g.swapped : !g.swapped;
  const tmp = document.createElement("div");
  tmp.innerHTML = g.scene.svg;
  const svg = tmp.querySelector("svg");
  svg.setAttribute("data-side", side);
  svg.setAttribute("aria-label", g.scene.name[lang] + " - " + (side === "left" ? S().leftLabel : S().rightLabel));
  g.diffs.forEach(function (d) { d.apply(svg, changed); });
  const ns = "http://www.w3.org/2000/svg";
  const overlay = document.createElementNS(ns, "g");
  overlay.setAttribute("class", "overlay");
  g.diffs.forEach(function (d) {
    const c = document.createElementNS(ns, "circle");
    c.setAttribute("cx", d.x);
    c.setAttribute("cy", d.y);
    c.setAttribute("r", d.r);
    c.setAttribute("class", "hot" + (hintId === d.id ? " hint-ring" : ""));
    c.setAttribute("data-diff", d.id);
    c.setAttribute("fill", "transparent");
    overlay.appendChild(c);
    if (found.has(d.id)) {
      const ring = document.createElementNS(ns, "circle");
      ring.setAttribute("cx", d.x);
      ring.setAttribute("cy", d.y);
      ring.setAttribute("r", d.r);
      ring.setAttribute("class", "found-ring");
      overlay.appendChild(ring);
    }
  });
  svg.appendChild(overlay);
  const label = side === "left" ? S().leftLabel : S().rightLabel;
  return "<div class=\"panel\"><div class=\"panel-label\">" + label + "</div>" + tmp.innerHTML + "</div>";
}

function panelsHtml() {
  return "<div class=\"panels\">" + buildPanel("left") + buildPanel("right") + "</div>";
}

function soundRowHtml() {
  const L = S();
  return "<div class=\"sound-row\"><button class=\"sound-btn\" data-act=\"toggle-sound\">" +
    (soundOn ? L.soundOn : L.soundOff) + "</button></div>";
}

function statusHtml() {
  const L = S();
  if (phase !== "play") return "<p class=\"status-line\">&nbsp;</p>";
  if (statusKind === "wrong") return "<p class=\"status-line wrong\">" + L.wrongMsg + "</p>";
  if (statusKind === "already") return "<p class=\"status-line\">" + L.alreadyMsg + "</p>";
  if (statusKind === "hint") return "<p class=\"status-line\">" + L.hintMsg + "</p>";
  return "<p class=\"status-line\">" + fmt(L.foundCount, { n: found.size }) + "</p>";
}

function renderGame() {
  const L = S();
  const area = el("gameArea");
  if (phase === "total") { area.innerHTML = totalHtml(); return; }
  const g = games[cur];
  let html = "";
  if (phase === "ready") {
    html += "<h3 class=\"phase-title\">" + L.readyTitle + "</h3>";
    html += "<p class=\"phase-desc\">" + L.readyDesc + "</p>";
    html += panelsHtml();
    html += "<div class=\"btn-row\"><button class=\"btn btn-primary\" data-act=\"start\">" + L.startBtn + "</button></div>";
  } else if (phase === "play") {
    html += "<h3 class=\"phase-title\">" + L.playTitle + "</h3>";
    html += "<p class=\"phase-desc\">" + fmt(L.playDesc, { n: g.n }) + "</p>";
    html += soundRowHtml();
    html += statusHtml();
    html += panelsHtml();
    html += "<div class=\"btn-row\"><button class=\"btn btn-ghost\" data-act=\"hint\">" + L.hintBtn + "</button></div>";
  } else { // result
    const sc = scores[cur];
    html += "<p class=\"score-line\">" + fmt(L.scoreText, { total: sc.n }) + "</p>";
    html += "<p class=\"praise\">" + praiseFor(sc.wrong) + "</p>";
    html += "<p class=\"attempts-line\">" + (sc.wrong === 0 ? L.wrongLine0 : fmt(L.wrongLine, { n: sc.wrong })) + "</p>";
    html += "<p class=\"found-list-title\">" + L.foundListTitle + "</p>";
    html += "<ul class=\"found-list\">" + g.diffs.map(function (d) {
      return "<li>" + d.name[lang] + "</li>";
    }).join("") + "</ul>";
    html += "<div class=\"btn-row\">";
    if (cur < 4) html += "<button class=\"btn btn-primary\" data-act=\"next\">" + L.nextBtn + "</button>";
    else html += "<button class=\"btn btn-primary\" data-act=\"final\">" + L.finalBtn + "</button>";
    html += "<button class=\"btn btn-ghost\" data-act=\"retry-game\">" + L.retryBtn + "</button></div>";
  }
  area.innerHTML = html;
}

function praiseFor(wrong) {
  const L = S();
  if (wrong === 0) return L.praisePerfect;
  if (wrong <= 2) return L.praiseGreat;
  return L.praiseGood;
}

function totalHtml() {
  const L = S();
  let clean = 0;
  let html = "<h3 class=\"phase-title\">" + L.totalTitle + "</h3>";
  html += "<ul class=\"total-list\">";
  scores.forEach(function (sc, i) {
    if (sc && sc.wrong === 0) clean++;
    html += "<li>" + fmt(L.totalLine, { i: i + 1, n: games[i].n, a: sc ? sc.wrong : 0 }) + "</li>";
  });
  html += "</ul>";
  html += "<p class=\"total-score\">" + fmt(L.totalScore, { got: clean }) + "</p>";
  const totalPraise = clean >= 5 ? 0 : (clean >= 3 ? 2 : 3);
  html += "<p class=\"praise\">" + praiseFor(totalPraise) + "</p>";
  html += "<div class=\"btn-row\"><button class=\"btn btn-primary\" data-act=\"restart-today\">" + L.restartTodayBtn + "</button></div>";
  return html;
}

function renderAll() { renderProgress(); renderGame(); }

function setStatus(kind) {
  const token = ++statusToken;
  statusKind = kind;
  renderGame();
  setTimeout(function () {
    if (token !== statusToken) return;
    statusKind = null;
    if (phase === "play") renderGame();
  }, fastMs(1600));
}

function startSet(seedStr) {
  setSeed = seedStr;
  games = buildSet(seedStr);
  resultToken++;
  statusToken++;
  cur = 0;
  phase = "ready";
  found = new Set();
  wrongTaps = 0;
  hintId = null;
  statusKind = null;
  scores = [null, null, null, null, null];
  renderAll();
}

function nextGame() {
  cur += 1;
  found = new Set();
  wrongTaps = 0;
  hintId = null;
  statusKind = null;
  phase = "ready";
  renderAll();
}

/* ---------- hotspot / tap handling ---------- */
function onHotspot(id) {
  const g = games[cur];
  if (found.has(id)) { setStatus("already"); return; }
  found.add(id);
  hintId = null;
  beep(660, 250);
  if (found.size >= g.n) {
    scores[cur] = { n: g.n, wrong: wrongTaps };
    renderGame();
    const token = ++resultToken;
    setTimeout(function () {
      if (token !== resultToken) return;
      if (phase !== "play") return;
      phase = "result";
      renderAll();
    }, fastMs(600));
    return;
  }
  renderGame();
}

function onWrongTap(evt, svgEl) {
  wrongTaps++;
  beep(160, 200);
  setStatus("wrong");
  // brief red ring where the reader tapped (skipped when no layout, e.g. tests)
  try {
    const rect = svgEl.getBoundingClientRect();
    if (rect && rect.width > 0 && evt.clientX !== undefined) {
      const x = (evt.clientX - rect.left) * 640 / rect.width;
      const y = (evt.clientY - rect.top) * 420 / rect.height;
      const svg = document.querySelector('.panel-svg[data-side="' + svgEl.getAttribute("data-side") + '"]');
      if (svg) {
        const ns = "http://www.w3.org/2000/svg";
        const ring = document.createElementNS(ns, "circle");
        ring.setAttribute("cx", x);
        ring.setAttribute("cy", y);
        ring.setAttribute("r", 30);
        ring.setAttribute("class", "wrong-ring");
        svg.appendChild(ring);
        const token = ++resultToken;
        setTimeout(function () {
          if (token !== resultToken) return;
          if (ring.parentNode) ring.parentNode.removeChild(ring);
        }, fastMs(1200));
      }
    }
  } catch (e) { /* layout unavailable — the count and message still work */ }
}

function showHint() {
  const g = games[cur];
  const remaining = g.diffs.filter(function (d) { return !found.has(d.id); });
  if (!remaining.length) return;
  hintId = remaining[0].id;
  setStatus("hint");
}

/* ---------- events (explicit handlers only) ---------- */
document.addEventListener("click", function (e) {
  const langBtn = e.target.closest("button[data-lang]");
  if (langBtn) {
    const next = langBtn.getAttribute("data-lang");
    if (next !== lang) { lang = next; applyStaticTexts(); } // game state is kept
    return;
  }
  const btn = e.target.closest("button[data-act]");
  if (btn && !btn.disabled) {
    const act = btn.getAttribute("data-act");
    if (act === "toggle-sound") {
      soundOn = !soundOn;
      renderGame();
      return;
    } else if (act === "start") {
      if (phase === "ready") { phase = "play"; renderAll(); }
      return;
    } else if (act === "hint") {
      if (phase === "play") showHint();
      return;
    } else if (act === "retry-game") {
      scores[cur] = null;
      found = new Set();
      wrongTaps = 0;
      hintId = null;
      statusKind = null;
      phase = "ready";
      renderAll();
      return;
    } else if (act === "next") {
      nextGame();
      return;
    } else if (act === "final") {
      phase = "total";
      renderAll();
      return;
    } else if (act === "restart-today") {
      startSet(dateSeedStr());
      return;
    } else if (act === "new-set") {
      startSet(dateSeedStr() + "-alt-" + Date.now());
      return;
    }
    return;
  }
  // picture taps (play phase only; ignore once all differences are found)
  if (phase !== "play") return;
  if (found.size >= games[cur].n) return;
  const hot = e.target.closest ? e.target.closest("[data-diff]") : null;
  if (hot) { onHotspot(hot.getAttribute("data-diff")); return; }
  const svgEl = e.target.closest ? e.target.closest(".panel-svg") : null;
  if (svgEl) onWrongTap(e, svgEl);
});

/* Test/debug accessor: read-only view of the current game state. */
window.__spot = {
  phase: function () { return phase; },
  diffs: function () { return games[cur].diffs.map(function (d) { return d.id; }); },
  setSignature: function () {
    return games.map(function (g) { return g.diffs.map(function (d) { return d.id; }).join("+") + (g.swapped ? "L" : "R"); }).join("|");
  },
  sceneName: function () { return games[cur].scene.id; },
  foundCount: function () { return found.size; },
  wrongTaps: function () { return wrongTaps; },
  scores: function () {
    return scores.map(function (s) { return s ? { n: s.n, wrong: s.wrong } : null; });
  }
};

/* ---------- init ---------- */
applyStaticTexts();
</script>
