/* ---------- seeded random: same day = same questions, next day = new ---------- */
function todaySeed() {
  const d = new Date();
  return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
}
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffled(arr, rand) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
function pickN(arr, n, rand) { return shuffled(arr, rand).slice(0, n); }

/* ---------- state ---------- */
let lang = "ko";
let reshuffleCount = 0; // "새로운 것으로 다시 하기" presses
const gameState = {};   // per game: { phase: 'mem'|'ask'|'done', data, ... }
/* one game at a time, like Day 1–9: progress through games 1 → 5 in order */
let currentGame = 1;
let finishedAll = false;
const solvedGames = {}; // gameNo -> true once answered correctly

function solvedCount() {
  return Object.keys(solvedGames).filter(function (k) { return solvedGames[k]; }).length;
}
function resetProgress() {
  currentGame = 1;
  finishedAll = false;
  for (const k in solvedGames) delete solvedGames[k];
}

function seedFor(gameNo) {
  return todaySeed() * 1000 + reshuffleCount * 97 + gameNo * 13;
}
function t() { return I18N[lang]; }
function el(id) { return document.getElementById(id); }

/* ---------- game data builders (seeded per day) ---------- */
function buildGameData(n) {
  const L = t();
  const rand = mulberry32(seedFor(n));
  if (n === 1) {
    const picked = pickN(L.names, 3, rand);
    const rest = L.names.filter(function (x) { return picked.indexOf(x) === -1; });
    const distract = pickN(rest, 3, rand);
    return { picked: picked, options: shuffled(picked.concat(distract), rand) };
  }
  if (n === 2) {
    const names = pickN(L.names, 4, rand);
    const rels = pickN(L.relations, 4, rand);
    return { pairs: names.map(function (nm, i) { return { name: nm, rel: rels[i] }; }),
             relOptions: shuffled(rels.slice(), rand) };
  }
  if (n === 3) {
    return { order: pickN(L.names, 5, rand) };
  }
  if (n === 4) {
    const names = pickN(L.names, 5, rand);
    const favs = pickN(L.favorites, 5, rand);
    return { pairs: names.map(function (nm, i) { return { name: nm, fav: favs[i] }; }),
             favOptions: shuffled(favs.slice(), rand) };
  }
  // game 5
  return { order: pickN(L.names, 7, rand) };
}

function initGame(n) {
  gameState[n] = { phase: "mem", data: buildGameData(n), sel: [], picks: {}, orderSel: [], fb: "" };
}

/* ---------- static sections ---------- */

  const L = t();
  el("title").textContent = L.title;
  el("subtitle").textContent = L.subtitle;
  el("howCard").innerHTML = "<h2>" + L.howTitle + "</h2>" +
    L.howSteps.map(function (s) { return "<p>" + s + "</p>"; }).join("");
  let dh = "<h2>" + L.diffTitle + "</h2><table class=\"diff\"><tr>";
  L.diffHead.forEach(function (h) { dh += "<th>" + h + "</th>"; });
  dh += "</tr>";
  L.diffRows.forEach(function (r) {
    dh += "<tr>" + r.map(function (c) { return "<td>" + c + "</td>"; }).join("") + "</tr>";
  });
  dh += "</table>";
  el("diffCard").innerHTML = dh;
  el("whyCard").innerHTML = "<h2>" + L.whyTitle + "</h2>" +
    L.whyParas.map(function (s) { return "<p>" + s + "</p>"; }).join("");
  el("tipsCard").innerHTML = "<h2>" + L.tipsTitle + "</h2><ul>" +
    L.tips.map(function (s) { return "<li>" + s + "</li>"; }).join("") + "</ul>";
  el("reshuffleBtn").textContent = L.reshuffle;
  el("footerNote").textContent = L.footer;
  document.querySelectorAll(".lang-btn").forEach(function (b) {
    b.classList.toggle("active", b.getAttribute("data-lang") === lang);
  });
  document.documentElement.lang = lang;
}

/* ---------- game rendering ---------- */
function gameCard(n) {
  const L = t();
  const g = L.games[n - 1];
  const st = gameState[n];
  let html = "<div class=\"card\" id=\"game" + n + "\">" +
    "<h2>" + n + ". " + g.name + "<span class=\"badge\">" + g.level + "</span></h2>" +
    "<p>" + g.desc + "</p>";
  if (st.phase === "mem") {
    html += "<p class=\"note\">" + L.memorizeHint + "</p>";
    html += memorizeHtml(n);
    html += "<br><button class=\"big-btn\" data-act=\"mem-done\" data-game=\"" + n + "\">" + L.memorized + "</button>";
  } else if (st.phase === "ask") {
    html += askHtml(n);
  } else {
    html += memorizeHtml(n);
    html += st.fb;
    html += "<br><button class=\"big-btn secondary\" data-act=\"retry\" data-game=\"" + n + "\">" + L.retry + "</button>";
    if (n < 5) {
      html += "<button class=\"big-btn\" data-act=\"next\" data-game=\"" + n + "\">" + L.nextGame + "</button>";
    } else {
      html += "<button class=\"big-btn\" data-act=\"finish\" data-game=\"" + n + "\">" + L.finishBtn + "</button>";
    }
  }
  html += "</div>";
  return html;
}

function memorizeHtml(n) {
  const st = gameState[n];
  const d = st.data;
  if (n === 1) {
    return d.picked.map(function (nm) { return "<span class=\"name-chip\">" + nm + "</span>"; }).join("");
  }
  if (n === 2) {
    return d.pairs.map(function (p) {
      return "<div class=\"pair-row\"><b>" + p.name + "</b> — " + p.rel + "</div>";
    }).join("");
  }
  if (n === 3) {
    return d.order.map(function (nm, i) {
      return "<div class=\"pair-row\"><b>" + (i + 1) + "</b>. " + nm + "</div>";
    }).join("");
  }
  if (n === 4) {
    return d.pairs.map(function (p) {
      return "<div class=\"pair-row\"><b>" + p.name + "</b> — " + p.fav + "</div>";
    }).join("");
  }
  const L = t();
  return d.order.map(function (nm, i) {
    return "<div class=\"pair-row\"><b>" + (i + 1) + L.seat + "</b> — " + nm + "</div>";
  }).join("");
}

function askHtml(n) {
  const L = t();
  const st = gameState[n];
  const d = st.data;
  let html = "";
  if (n === 1) {
    html += "<p>" + L.pick3 + "</p>";
    html += d.options.map(function (nm) {
      const sel = st.sel.indexOf(nm) !== -1 ? " selected" : "";
      return "<button class=\"opt-btn" + sel + "\" data-act=\"pick\" data-game=\"1\" data-val=\"" + nm + "\">" + nm + "</button>";
    }).join("");
    html += "<br><button class=\"big-btn\" data-act=\"check\" data-game=\"1\" " +
      (st.sel.length === 3 ? "" : "disabled") + ">" + L.check + "</button>";
  } else if (n === 2 || n === 4) {
    const opts = n === 2 ? d.relOptions : d.favOptions;
    html += "<p>" + L.matchHint + "</p><div class=\"match-grid\">";
    d.pairs.forEach(function (p) {
      html += "<div class=\"match-row\"><span class=\"match-name\">" + p.name + "</span>";
      opts.forEach(function (o) {
        const sel = st.picks[p.name] === o ? " selected" : "";
        html += "<button class=\"opt-btn" + sel + "\" data-act=\"match\" data-game=\"" + n +
          "\" data-name=\"" + p.name + "\" data-val=\"" + o + "\">" + o + "</button>";
      });
      html += "</div>";
    });
    html += "</div><button class=\"big-btn\" data-act=\"check\" data-game=\"" + n + "\">" + L.check + "</button>";
  } else {
    const opts = shuffled(d.order.slice(), mulberry32(seedFor(n) + 5));
    html += "<p>" + (n === 3 ? L.pickOrder : L.seatHint) + "</p>";
    html += "<div class=\"order-picked\">" + L.yourPick + ": " + st.orderSel.join(" → ") + "</div>";
    html += opts.map(function (nm) {
      const used = st.orderSel.indexOf(nm) !== -1;
      return "<button class=\"opt-btn\" data-act=\"order\" data-game=\"" + n + "\" data-val=\"" + nm + "\" " +
        (used ? "disabled" : "") + ">" + nm + "</button>";
    }).join("");
    html += "<br><button class=\"big-btn\" data-act=\"check\" data-game=\"" + n + "\" " +
      (st.orderSel.length === d.order.length ? "" : "disabled") + ">" + L.check + "</button>";
  }
  return html;
}

function renderProgress() {
  const L = t();
  const shown = finishedAll ? 5 : currentGame;
  el("progressBar").innerHTML = L.progressGame + " " + shown + " / 5" +
    "<span class=\"score\">" + L.solvedLabel + ": " + solvedCount() + " / 5</span>";
}

function finishCard() {
  const L = t();
  return "<div class=\"card finish-msg\">" +
    "<h2>" + L.finishTitle + "</h2>" +
    "<p class=\"big-score\">" + L.solvedLabel + ": " + solvedCount() + " / 5</p>" +
    "<p>" + L.finishText + "</p>" +
    "<button class=\"big-btn\" data-act=\"restart\">" + L.restart + "</button></div>";
}

function renderGames() {
  renderProgress();
  el("games").innerHTML = finishedAll ? finishCard() : gameCard(currentGame);
}

function renderAll() {
  renderStatic();
  renderGames();
}

/* ---------- checking ---------- */
function checkAnswer(n) {
  const L = t();
  const st = gameState[n];
  const d = st.data;
  let ok = false;
  let answerText = "";
  if (n === 1) {
    ok = st.sel.length === 3 && st.sel.every(function (x) { return d.picked.indexOf(x) !== -1; });
    answerText = d.picked.join(", ");
  } else if (n === 2) {
    ok = d.pairs.every(function (p) { return st.picks[p.name] === p.rel; });
    answerText = d.pairs.map(function (p) { return p.name + " - " + p.rel; }).join(", ");
  } else if (n === 3 || n === 5) {
    ok = st.orderSel.join("|") === d.order.join("|");
    answerText = d.order.join(" → ");
  } else {
    ok = d.pairs.every(function (p) { return st.picks[p.name] === p.fav; });
    answerText = d.pairs.map(function (p) { return p.name + " - " + p.fav; }).join(", ");
  }
  if (ok) solvedGames[n] = true;
  st.phase = "done";
  st.fb = "<div class=\"feedback " + (ok ? "good" : "bad") + "\">" + (ok ? L.correct : L.wrong) + "</div>" +
    "<p>" + L.answerIs + ": " + answerText + "</p>";
  renderGames();
}

/* ---------- events (plain handlers; no MutationObserver) ---------- */
el("games").addEventListener("click", function (e) {
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const act = btn.getAttribute("data-act");
  if (act === "restart") {
    resetProgress();
    for (let g = 1; g <= 5; g++) initGame(g);
    renderGames();
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  const n = parseInt(btn.getAttribute("data-game"), 10);
  const st = gameState[n];
  if (act === "next") {
    currentGame = n + 1;
    renderGames();
    window.scrollTo({ top: el("progressBar").offsetTop - 10, behavior: "smooth" });
  }
  else if (act === "finish") {
    finishedAll = true;
    renderGames();
    window.scrollTo({ top: el("progressBar").offsetTop - 10, behavior: "smooth" });
  }
  else if (act === "mem-done") { st.phase = "ask"; renderGames(); }
  else if (act === "retry") { initGame(n); renderGames(); }
  else if (act === "pick") {
    const v = btn.getAttribute("data-val");
    const i = st.sel.indexOf(v);
    if (i === -1) { if (st.sel.length < 3) st.sel.push(v); }
    else st.sel.splice(i, 1);
    renderGames();
  }
  else if (act === "match") {
    st.picks[btn.getAttribute("data-name")] = btn.getAttribute("data-val");
    renderGames();
  }
  else if (act === "order") {
    const v = btn.getAttribute("data-val");
    if (st.orderSel.indexOf(v) === -1) st.orderSel.push(v);
    renderGames();
  }
  else if (act === "check") { checkAnswer(n); }
});

el("langBar").addEventListener("click", function (e) {
  const btn = e.target.closest("button[data-lang]");
  if (!btn) return;
  lang = btn.getAttribute("data-lang");
  resetProgress();
  for (let n = 1; n <= 5; n++) initGame(n); // language change restarts the games with new words
  renderAll();
});

el("reshuffleBtn").addEventListener("click", function () {
  reshuffleCount++;
  resetProgress();
  for (let n = 1; n <= 5; n++) initGame(n);
  renderAll();
  window.scrollTo({ top: 0, behavior: "smooth" });
});

/* ---------- init ---------- */
for (let n = 1; n <= 5; n++) initGame(n);
renderAll();
</script>
