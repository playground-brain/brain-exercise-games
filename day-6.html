    <link

    />
    <style>
      :root {
        --bg: #fdf6ec;
        --bg-soft: #fbeed9;
        --card: #fffdf8;
        --ink: #3a2a1c;
        --ink-soft: #6f5a44;
        --line: #ecd9bd;
        --accent: #d95d0f;
        --accent-strong: #b84a08;
        --accent-soft: #fdeeda;
        --good: #2e7d46;
        --good-soft: #e4f4e8;
        --bad: #b3402a;
        --bad-soft: #fbe9e3;
        --key: #fff7ea;
        --key-line: #e6cfa8;
        --shadow: 0 10px 30px rgba(146, 90, 32, 0.14);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #221812;
          --bg-soft: #2c1f16;
          --card: #2f2118;
          --ink: #f7ead9;
          --ink-soft: #cdb59c;
          --line: #4d3826;
          --accent: #f08a3c;
          --accent-strong: #ffb066;
          --accent-soft: #453022;
          --good: #7fd79b;
          --good-soft: #22392a;
          --bad: #ff9d87;
          --bad-soft: #40261f;
          --key: #3a2a1e;
          --key-line: #57402a;
          --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Pretendard Variable", Pretendard, -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
        font-size: 20px;
        line-height: 1.6;
      }
      .wrap { max-width: 760px; margin: 0 auto; padding: 28px 18px 64px; }

      /* ---------- 언어 선택 ---------- */
      .lang-bar {
        display: flex; flex-wrap: wrap; gap: 10px;
        margin-bottom: 22px;
      }
      .lang-btn {
        flex: 1 1 0; min-width: 104px; min-height: 56px;
        padding: 10px 14px;
        font-family: inherit; font-size: 20px; font-weight: 800;
        color: var(--accent-strong);
        background: var(--card); border: 2px solid var(--accent);
        border-radius: 14px; cursor: pointer;
      }
      .lang-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

      /* ---------- 머리말 ---------- */
      .day-chip {
        display: inline-flex; align-items: center; gap: 8px;
        background: var(--accent-soft); color: var(--accent-strong);
        font-weight: 800; font-size: 17px;
        padding: 8px 16px; border-radius: 999px;
      }
      .day-chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
      h1 {
        font-size: clamp(34px, 7.5vw, 46px);
        line-height: 1.25; font-weight: 900; letter-spacing: -0.02em;
        margin: 16px 0 10px;
      }
      .lede { font-size: 21px; color: var(--ink-soft); margin: 0 0 6px; }
      .today-line { font-size: 18px; color: var(--ink-soft); margin: 10px 0 0; }
      .today-line strong { color: var(--accent-strong); }

      /* ---------- 게임 판 ---------- */
      .game-card {
        margin-top: 26px;
        background: var(--card);
        border: 2px solid var(--line);
        border-radius: 24px;
        box-shadow: var(--shadow);
        padding: 26px 22px 30px;
      }
      .game-top {
        display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
        gap: 10px 16px; margin-bottom: 6px;
      }
      .round-label { font-size: 22px; font-weight: 800; }
      .round-label .of { color: var(--ink-soft); font-weight: 600; font-size: 19px; }
      .score-label { font-size: 19px; font-weight: 700; color: var(--ink-soft); }
      .score-label strong { color: var(--accent-strong); font-size: 22px; }
      .progress-dots { display: flex; gap: 8px; margin: 10px 0 4px; }
      .progress-dots span {
        flex: 1; height: 12px; border-radius: 999px; background: var(--bg-soft);
        border: 1px solid var(--line);
      }
      .progress-dots span.done { background: var(--good); border-color: var(--good); }
      .progress-dots span.now { background: var(--accent); border-color: var(--accent); }
      .level-line { font-size: 19px; color: var(--ink-soft); margin: 8px 0 0; }
      .level-line strong { color: var(--ink); }

      .stage { margin-top: 18px; text-align: center; }
      .stage-msg { font-size: 22px; font-weight: 700; margin: 0 0 6px; }
      .stage-sub { font-size: 19px; color: var(--ink-soft); margin: 0 0 18px; }

      .lyric-board {
        min-height: 128px;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
        background: var(--bg-soft);
        border: 2px dashed var(--line);
        border-radius: 18px;
        padding: 22px 16px;
      }
      .lyric-label { font-size: 17px; font-weight: 700; color: var(--ink-soft); margin: 0; }
      .lyric {
        font-size: clamp(26px, 6.5vw, 36px);
        font-weight: 900; line-height: 1.4; margin: 0;
      }
      .lyric::before { content: "♪ "; color: var(--accent); }
      .lyric::after { content: " ♪"; color: var(--accent); }

      .singer-hint {
        margin-top: 14px; font-size: 19px; font-weight: 700; color: var(--accent-strong);
        background: var(--accent-soft); border-radius: 12px; padding: 12px 16px;
      }
      .hint-btn-row { margin-top: 14px; }

      .options {
        display: grid; grid-template-columns: 1fr; gap: 12px;
        max-width: 560px; margin: 22px auto 0; text-align: left;
      }
      @media (min-width: 580px) {
        .options { grid-template-columns: 1fr 1fr; }
      }
      .opt-btn {
        min-height: 68px; padding: 14px 18px;
        font-family: inherit; font-size: 22px; font-weight: 800; color: var(--ink);
        background: var(--key); border: 2px solid var(--key-line); border-radius: 16px;
        cursor: pointer; text-align: center; line-height: 1.35;
      }
      .opt-btn:active { background: var(--accent-soft); }
      .opt-btn.picked-good { background: var(--good-soft); border-color: var(--good); color: var(--good); }
      .opt-btn.picked-bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
      .opt-btn.reveal-good { background: var(--good-soft); border-color: var(--good); color: var(--good); }

      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        min-height: 60px; padding: 14px 30px;
        font-family: inherit; font-size: 22px; font-weight: 800;
        border-radius: 16px; border: 2px solid transparent; cursor: pointer;
      }
      .btn-primary { background: var(--accent); color: #fff; }
      .btn-primary:active { background: var(--accent-strong); }
      .btn-ghost { background: transparent; color: var(--accent-strong); border-color: var(--accent); }
      .btn-row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 20px; }
      button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
      button:disabled { opacity: 0.45; cursor: not-allowed; }

      .feedback {
        margin-top: 20px; border-radius: 16px; padding: 20px 18px; text-align: center;
      }
      .feedback.good { background: var(--good-soft); }
      .feedback.bad { background: var(--bad-soft); }
      .feedback .fb-title { font-size: 26px; font-weight: 900; margin: 0 0 6px; }
      .feedback.good .fb-title { color: var(--good); }
      .feedback.bad .fb-title { color: var(--bad); }
      .feedback p { margin: 4px 0; font-size: 20px; }
      .feedback .fb-answer { font-size: 24px; font-weight: 900; }
      .feedback .fb-note { font-size: 18px; color: var(--ink-soft); }

      .result-box { text-align: center; padding: 10px 0 2px; }
      .result-score { font-size: clamp(52px, 14vw, 76px); font-weight: 900; color: var(--accent-strong); line-height: 1.1; margin: 6px 0; }
      .result-msg { font-size: 22px; font-weight: 700; margin: 0 0 8px; }
      .result-sub { font-size: 19px; color: var(--ink-soft); margin: 0; }

      /* ---------- 설명 ---------- */
      section.howto { margin-top: 48px; }
      h2 {
        font-size: 28px; font-weight: 900; letter-spacing: -0.01em;
        margin: 0 0 16px; padding-bottom: 10px; border-bottom: 3px solid var(--accent-soft);
      }
      .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
      .steps li {
        display: flex; gap: 16px; align-items: flex-start;
        background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 18px;
      }
      .step-num {
        flex: 0 0 auto; width: 46px; height: 46px; border-radius: 50%;
        background: var(--accent); color: #fff;
        display: flex; align-items: center; justify-content: center;
        font-size: 23px; font-weight: 900;
      }
      .steps h3 { margin: 2px 0 4px; font-size: 22px; font-weight: 800; }
      .steps p { margin: 0; font-size: 19px; color: var(--ink-soft); }
      .example {
        margin-top: 16px; text-align: center;
        background: var(--bg-soft); border-radius: 18px; padding: 20px 14px;
        font-size: clamp(22px, 6vw, 30px); font-weight: 900; line-height: 1.45;
      }
      .example .arrow { color: var(--accent); margin: 0 10px; }
      .example small { display: block; font-size: 17px; font-weight: 600; color: var(--ink-soft); margin-top: 8px; }

      .level-table { width: 100%; border-collapse: collapse; font-size: 19px; }
      .level-table th, .level-table td { padding: 12px 10px; text-align: left; border-bottom: 1px solid var(--line); }
      .level-table th { font-weight: 800; background: var(--bg-soft); }

      .tips { margin: 0; padding-left: 24px; display: grid; gap: 8px; font-size: 19px; }
      .why p { font-size: 19px; color: var(--ink-soft); margin: 0 0 10px; }
      .why strong { color: var(--ink); }

      footer {
        margin-top: 52px; padding-top: 20px; border-top: 2px solid var(--line);
        font-size: 17px; color: var(--ink-soft); text-align: center;
      }
      footer a { color: var(--accent-strong); font-weight: 700; display: inline-block; padding: 10px 6px; }
      [hidden] { display: none !important; }

      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; animation: none !important; }
      }
    </style>
  </head>

          ],
          ja: [
            {

                { title: "世界に一つだけの花", singer: "SMAP", hint: "世界に一つだけの花", note: "2003年に大ヒットしたSMAPの曲。一人ひとりの大切さを歌っています。" },
                { title: "さくら", singer: "森山直太朗", hint: "さくら さくら 今、咲き誇る", note: "森山直太朗さんの卒業の歌として親しまれる、桜の名曲です。" },
                { title: "翼をください", singer: "赤い鳥", hint: "いま私の願いごとが", note: "1971年の赤い鳥の曲。今では合唱曲として学校でも歌われています。" }
              ]
            },
            {
              name: "やさしい",
              songs: [
                { title: "糸", singer: "中島みゆき", hint: "なぜ めぐり逢うのかを", note: "中島みゆきさんの曲。人と人との出会いを糸にたとえた名曲です。" },
                { title: "川の流れのように", singer: "美空ひばり", hint: "知らず知らず歩いてきた", note: "美空ひばりさんの最後のシングルとして知られる、人生を歌った名曲です。" },
                { title: "いい日旅立ち", singer: "山口百恵", hint: "雪解け間近の北の空に向かい", note: "1978年の山口百恵さんの曲。旅立ちの切なさと希望を歌っています。" },
                { title: "乾杯", singer: "長渕剛", hint: "かたい絆に思いを寄せて", note: "長渕剛さんの曲。結婚式や門出の場面でよく歌われる応援歌です。" }

              songs: [
                { title: "涙そうそう", singer: "夏川りみ", hint: "古いアルバムの中に", note: "夏川りみさんの歌で広く知られる、亡き人を思う温かい歌です。" },
                { title: "贈る言葉", singer: "海援隊", hint: "暮れなずむ町の光と影の中", note: "卒業式の定番として長く歌い継がれてきた、海援隊の名曲です。" },
                { title: "千の風になって", singer: "秋川雅史", hint: "私のお墓の前で泣かないでください", note: "秋川雅史さんの歌唱で大ヒットした、千の風を歌う曲です。" },
                { title: "ハナミズキ", singer: "一青窈", hint: "空を押し上げて手を伸ばす君", note: "一青窈さんの代表曲。大切な人の幸せを願う歌です。" }
              ]
            },
            {
              name: "むずかしい",
              songs: [
                { title: "時代", singer: "中島みゆき", hint: "今はこんなに悲しくて", note: "中島みゆきさんの初期の名曲。時代はめぐるという歌詞が心に残ります。" },
                { title: "津軽海峡・冬景色", singer: "石川さゆり", hint: "上野発の夜行列車降りた時から", note: "石川さゆりさんの代表的な演歌。冬の津軽海峡の情景が浮かびます。" },
                { title: "天城越え", singer: "石川さゆり", hint: "隠しきれない移り香が", note: "石川さゆりさんの情熱的な歌唱で知られる演歌の名曲です。" },
                { title: "北の宿から", singer: "都はるみ", hint: "あなた変わりはないですか", note: "都はるみさんの大ヒット曲。遠くの人を思う気持ちを歌っています。" }
              ]
            },
            {
              name: "最後の挑戦",
              songs: [
                { title: "青い山脈", singer: "藤山一郎", hint: "若く明るい歌声に", note: "1949年の映画主題歌。戦後の日本を明るく照らした歌です。" },
                { title: "東京ブギウギ", singer: "笠置シヅ子", hint: "東京ブギウギ リズムうきうき", note: "笠置シヅ子さんの明るい歌声で、戦後の日本中を元気にしました。" },
                { title: "リンゴの唄", singer: "並木路子", hint: "赤いリンゴに唇寄せて", note: "戦後最初のヒット曲として知られる、並木路子さんの歌です。" },
                { title: "蘇州夜曲", singer: "李香蘭", hint: "君がみ胸に抱かれて聞くは", note: "1940年の映画の挿入歌。李香蘭さんの澄んだ歌声が印象的です。" }
              ]
            }
          ]
        };

        /* ================================================================
           날짜 기반 랜덤
           오늘 날짜를 씨앗(seed)으로 삼아 노래를 뽑아요.
           같은 날에는 같은 노래가, 다음 날에는 새로운 노래가 나와요.
           「새로운 노래로 다시 하기」를 누르면 시도 횟수가 씨앗에 더해져 또 다른 노래가 돼요.
           언어와 상관없이 날짜 씨앗은 같아요.
           ================================================================ */
        function mulberry32(seed) {
          var a = seed >>> 0;
          return function () {
            a |= 0; a = (a + 0x6d2b79f5) | 0;
            var t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        var now = new Date();
        var dateSeed = now.getFullYear() * 10000 + (now.getMonth() + 1) * 100 + now.getDate();

        function formatToday(lang) {
          if (lang === "en") {
            var enDays = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
            var enMonths = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            return enDays[now.getDay()] + ", " + enMonths[now.getMonth()] + " " + now.getDate() + ", " + now.getFullYear();
          }
          if (lang === "ja") {
            var jaDays = ["日", "月", "火", "水", "木", "金", "土"];
            return now.getFullYear() + "年" + (now.getMonth() + 1) + "月" + now.getDate() + "日（" + jaDays[now.getDay()] + "）";
          }
          var weekNames = ["일", "월", "화", "수", "목", "금", "토"];
          return now.getFullYear() + "년 " + (now.getMonth() + 1) + "월 " + now.getDate() + "일 (" + weekNames[now.getDay()] + ")";
        }

        function shuffle(rand, arr) {
          var a = arr.slice();
          for (var i = a.length - 1; i > 0; i--) {
            var j = Math.floor(rand() * (i + 1));
            var t = a[i]; a[i] = a[j]; a[j] = t;
          }
          return a;
        }

        function allSongs(lang) {
          var out = [];
          DATA[lang].forEach(function (tier) {
            tier.songs.forEach(function (s) { out.push(s); });
          });
          return out;
        }

        function buildRounds(lang, attempt) {
          var rand = mulberry32(dateSeed * 1000 + attempt * 131 + 61);
          var pool = allSongs(lang);
          return DATA[lang].map(function (tier) {
            var song = tier.songs[Math.floor(rand() * tier.songs.length)];
            var others = pool.filter(function (s) { return s.title !== song.title; });
            var distractors = shuffle(rand, others).slice(0, 3);
            var options = shuffle(rand, distractors.concat([song]));
            return { name: tier.name, song: song, options: options };
          });
        }

        /* ---------- 상태 ---------- */
        var lang = "ko";
        var attempt = 0;
        var rounds = buildRounds(lang, attempt);
        var roundIdx = 0;
        var score = 0;
        var phase = "ready"; /* ready | quiz | feedback | done */
        var hintShown = false;

        function S() { return STR[lang]; }

        var stageBox = document.getElementById("stageBox");
        var roundNowEl = document.getElementById("roundNow");
        var scoreNowEl = document.getElementById("scoreNow");
        var levelLineEl = document.getElementById("levelLine");
        var dotsEl = document.getElementById("progressDots");

        function esc(s) {
          return s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
        }

        /* ---------- 고정 문구 번역 ---------- */
        function applyStatic() {
          var s = S();
          document.documentElement.lang = s.docLang;
          document.title = s.title;
          document.getElementById("chipText").textContent = s.chip;
          document.getElementById("h1Text").textContent = s.h1;
          document.getElementById("ledeText").textContent = s.lede;
          document.getElementById("todayLine").innerHTML =
            esc(s.todayA) + "<strong>" + esc(formatToday(lang)) + "</strong>" +
            esc(s.todayB) + "<strong>" + esc(s.todayC) + "</strong>" + esc(s.todayD);
          document.getElementById("roundWord").textContent = s.roundWord;
          document.getElementById("scoreWord").textContent = s.scoreWord;
          document.getElementById("scoreUnit").textContent = s.scoreUnit;
          document.getElementById("howtoTitle").textContent = s.howtoTitle;

          var stepsHtml = "";
          s.steps.forEach(function (step, i) {
            stepsHtml += '<li><div class="step-num">' + (i + 1) + "</div><div><h3>" +
              esc(step.h) + "</h3><p>" + esc(step.p) + "</p></div></li>";
          });
          document.getElementById("stepsList").innerHTML = stepsHtml;

          document.getElementById("exampleBox").innerHTML =
            esc(s.exampleLyric) + '<span class="arrow">→</span>' + esc(s.exampleTitle) +
            "<small>" + esc(s.exampleNote) + "</small>";

          document.getElementById("levelTitle").textContent = s.levelTitle;
          document.getElementById("thGame").textContent = s.thGame;
          document.getElementById("thLevel").textContent = s.thLevel;
          document.getElementById("thKind").textContent = s.thKind;
          var rows = "";
          DATA[lang].forEach(function (tier, i) {
            rows += "<tr><td>" + esc(s.gameWord) + " " + (i + 1) + "</td><td>" +
              esc(tier.name) + "</td><td>" + esc(s.tierDesc[i]) + "</td></tr>";
          });
          document.getElementById("levelBody").innerHTML = rows;

          document.getElementById("whyTitle").textContent = s.whyTitle;
          document.getElementById("whyBody").innerHTML =
            s.why.map(function (p) { return "<p>" + p + "</p>"; }).join("");

          document.getElementById("tipTitle").textContent = s.tipTitle;
          document.getElementById("tipsList").innerHTML =
            s.tips.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("");

          document.getElementById("footerText").innerHTML = s.footer;
          document.getElementById("blogLink").textContent = s.blogLink;

          var btns = document.querySelectorAll(".lang-btn");
          for (var i = 0; i < btns.length; i++) {
            var on = btns[i].getAttribute("data-lang") === lang;
            btns[i].className = "lang-btn" + (on ? " active" : "");
            btns[i].setAttribute("aria-pressed", on ? "true" : "false");
          }
        }

        function renderTop() {
          roundNowEl.textContent = String(Math.min(roundIdx + 1, 5));
          scoreNowEl.textContent = String(score);
          var dots = dotsEl.children;
          for (var i = 0; i < dots.length; i++) {
            dots[i].className = i < roundIdx || phase === "done" ? "done" : i === roundIdx ? "now" : "";
          }
          if (phase === "done") {
            levelLineEl.textContent = S().levelDone;
          } else {
            var r = rounds[roundIdx];
            levelLineEl.innerHTML =
              esc(S().levelPrefix) + "<strong>" + esc(r.name) + "</strong>" + esc(S().levelSuffix);
          }
        }

        /* ---------- 단계별 화면 ---------- */
        function showReady() {
          phase = "ready"; hintShown = false; renderTop();
          var s = S();
          stageBox.innerHTML =
            '<p class="stage-msg">' + esc(roundIdx === 0 ? s.readyFirst : s.readyNext) + "</p>" +
            '<p class="stage-sub">' + s.readySub + "</p>" +
            '<div class="lyric-board"><p class="lyric-label">' + esc(s.lyricLabel) + '</p><p class="lyric">' + esc(s.lyricMystery) + "</p></div>" +
            '<div class="btn-row"><button type="button" class="btn btn-primary" id="btnShow">' + esc(s.showBtn) + "</button></div>";
          document.getElementById("btnShow").addEventListener("click", showQuiz);
        }

        function showQuiz() {
          phase = "quiz"; renderTop();
          var s = S();
          var r = rounds[roundIdx];
          var html =
            '<p class="stage-msg">' + esc(s.quizMsg) + "</p>" +
            '<p class="stage-sub">' + esc(s.quizSub) + "</p>" +
            '<div class="lyric-board"><p class="lyric-label">' + esc(s.lyricLabel) + '</p><p class="lyric">' + esc(r.song.hint) + "</p></div>" +
            '<div id="hintZone">' +
            (hintShown
              ? '<p class="singer-hint">' + esc(s.hintText(r.song.singer)) + "</p>"
              : '<div class="hint-btn-row"><button type="button" class="btn btn-ghost" id="btnHint">' + esc(s.hintBtn) + "</button></div>") +
            "</div>" +
            '<div class="options" role="group" aria-label="' + esc(s.optionsLabel) + '">';
          r.options.forEach(function (opt, i) {
            html += '<button type="button" class="opt-btn" data-idx="' + i + '">' + esc(opt.title) + "</button>";
          });
          html += "</div>";
          stageBox.innerHTML = html;

          var hintBtn = document.getElementById("btnHint");
          if (hintBtn) {
            hintBtn.addEventListener("click", function () {
              hintShown = true;
              document.getElementById("hintZone").innerHTML =
                '<p class="singer-hint">' + esc(S().hintText(rounds[roundIdx].song.singer)) + "</p>";
            });
          }
          var btns = stageBox.querySelectorAll(".opt-btn");
          for (var i = 0; i < btns.length; i++) {
            btns[i].addEventListener("click", function () {
              pickAnswer(parseInt(this.getAttribute("data-idx"), 10), this);
            });
          }
        }

        function pickAnswer(idx, btnEl) {
          if (phase !== "quiz") return;
          phase = "feedback";
          var s = S();
          var r = rounds[roundIdx];
          var picked = r.options[idx];
          var ok = picked.title === r.song.title;
          if (ok) score++;

          /* 고른 버튼과 정답 버튼에 색을 입혀 보여 줘요 */
          var btns = stageBox.querySelectorAll(".opt-btn");
          for (var i = 0; i < btns.length; i++) {
            btns[i].disabled = true;
            if (btns[i] === btnEl) btns[i].className = "opt-btn " + (ok ? "picked-good" : "picked-bad");
            else if (r.options[i].title === r.song.title) btns[i].className = "opt-btn reveal-good";
          }
          renderTop();

          var last = roundIdx === rounds.length - 1;
          var fb = document.createElement("div");
          fb.innerHTML =
            '<div class="feedback ' + (ok ? "good" : "bad") + '">' +
            '<p class="fb-title">' + esc(ok ? s.praise[roundIdx % s.praise.length] : s.cheer[roundIdx % s.cheer.length]) + "</p>" +
            "<p>" + esc(ok ? s.answerIs : s.answerWas) + '<span class="fb-answer">「' + esc(r.song.title) + "」</span>" + esc(ok ? s.answerEndGood : s.answerEndBad) + "</p>" +
            "<p>" + esc(s.sungBy(r.song.singer)) + "</p>" +
            '<p class="fb-note">' + esc(r.song.note) + "</p>" +
            "</div>" +
            '<div class="btn-row"><button type="button" class="btn btn-primary" id="btnNext">' +
            esc(last ? s.resultBtn : s.nextBtn) + "</button></div>";
          stageBox.appendChild(fb);
          document.getElementById("btnNext").addEventListener("click", function () {
            if (last) showResult();
            else { roundIdx++; showReady(); }
          });
          fb.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }

        function showResult() {
          phase = "done"; renderTop();
          var s = S();
          var res = score === 5 ? s.results[0] : score >= 3 ? s.results[1] : score >= 1 ? s.results[2] : s.results[3];
          stageBox.innerHTML =
            '<div class="result-box">' +
            '<p class="stage-sub" style="margin-bottom:0">' + esc(s.resultLabel) + "</p>" +
            '<p class="result-score">' + score + " / 5</p>" +
            '<p class="result-msg">' + esc(res.msg) + "</p>" +
            '<p class="result-sub">' + esc(res.sub) + "</p>" +
            '<div class="btn-row">' +
            '<button type="button" class="btn btn-primary" id="btnAgain">' + esc(s.againBtn) + "</button>" +
            "</div>" +
            '<p class="stage-sub" style="margin-top:16px">' + esc(s.tomorrowNote) + "</p>" +
            "</div>";
          document.getElementById("btnAgain").addEventListener("click", function () {
            attempt++;
            rounds = buildRounds(lang, attempt);
            roundIdx = 0; score = 0;
            showReady();
            document.getElementById("gameCard").scrollIntoView({ behavior: "smooth", block: "start" });
          });
        }

        /* ---------- 언어 바꾸기 ---------- */
        function setLang(next) {
          if (!STR[next] || !DATA[next]) return;
          lang = next;
          attempt = 0;
          rounds = buildRounds(lang, attempt);
          roundIdx = 0; score = 0; hintShown = false;
          applyStatic();
          showReady();
        }
        var langBtns = document.querySelectorAll(".lang-btn");
        for (var i = 0; i < langBtns.length; i++) {
          langBtns[i].addEventListener("click", function () {
            setLang(this.getAttribute("data-lang"));
          });
        }

        applyStatic();
        showReady();
      })();
    </script>
